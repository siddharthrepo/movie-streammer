services:
  mysql:
    image: mysql:8.0
    container_name: movie-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movie_streamer
      MYSQL_USER: movie
      MYSQL_PASSWORD: movie
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-umovie", "-pmovie", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
